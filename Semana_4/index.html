<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipo de display</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!--
    Inline: Ocupa solo el ancho del contenido
    Block: Ocupa todo el ancho disponible
    Inkline-block: Combina caracteristicas de inline y block
    None: no se muestra en la pagona
    Flex: Contenedor flexible para diseño responsivo
    Grid: Contenedor para diseño en cuadrícula

    -->
    <h1>Demo: Tipos de display</h1>
    <div class="container">
        <div class="items">Caja1</div> 
        <div class="items">Caja2</div> 
        <div class="items">Caja3</div> 
        <div class="items">Caja4</div> 
        <div class="items">Caja5</div> 
    </div>

</body>
</html>
